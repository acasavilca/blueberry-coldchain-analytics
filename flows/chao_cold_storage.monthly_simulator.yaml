id: monthly_simulator
namespace: chao_cold_storage

inputs:
  - id: start_date
    type: DATE

  - id: end_date
    type: DATE

  - id: frequency
    type: STRING
    defaults: "hourly"

  - id: seed
    type: INT
    defaults: 42

  - id: fruit_type
    type: STRING
    defaults: "blueberry"

  - id: weather_seed_data
    type: FILE

pluginDefaults:
  - type: io.kestra.plugin.gcp
    values:
      serviceAccount: "{{secret('GCP_SERVICE_ACCOUNT')}}"
      projectId: "{{kv('GCP_PROJECT_ID')}}"
      location: "{{kv('GCP_LOCATION')}}"
      bucket: "{{kv('GCP_BUCKET_NAME')}}"

tasks:
  - id: get_state
    type: io.kestra.plugin.core.kv.Get
    key: "simulation_state_{{ inputs.fruit_type }}"
    
  - id: simulator
    type: io.kestra.plugin.scripts.python.Script
    containerImage: blueberry_simulator:v001
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    namespaceFiles:
      enabled: true
    outputFiles:
      - "raw/**/*.parquet"
      - "updated_state.json"
    script: |
      from config import (
          LOCATION,
          FORCING_CONFIG,
          SCHEDULER_CONFIG,
          SIMULATION_CONFIG,
          TELEMETRY_CONFIG,
          RUNTIME_CONFIG,
          FRUIT_CONFIGS,
          EVENTS_DTYPES,
          BATCHES_DTYPES,
          TELEMETRY_DTYPES,
      )
      
      from simulator import (
          prepare_forcing_arrays,
          get_tr,
          create_numba_dicts,
          build_door_and_mass_schedules,
          run_simulation_chunk,
          build_batch_event_tables,
          build_telemetry_table,
          expand_minute_timestamps_to_internal,
          encode_coordinates,
          get_timezone_name,
          fix_timestamps,
          enforce_dtypes,
          create_seed,
      )
      from run_one_chunk import load_state, deserialize_active_batches, serialize_active_batches
      import json
      import pandas as pd
      from pathlib import Path
      from respiration_data import RESPIRATION_DB
      import numpy as np
      from datetime import datetime

      # Define parameters

      LOCAL_OUT = Path(".")
      FRUIT_TYPE = "{{ inputs.fruit_type }}"
      FRUIT_SEED_OFFSET = {"blueberry": 0, "avocado": 333}
      BASE_SEED = int({{ inputs.seed }} + FRUIT_SEED_OFFSET[FRUIT_TYPE])
      LATITUDE = LOCATION["latitude"]
      LONGITUDE = LOCATION["longitude"]
      PLANT_ID = encode_coordinates(float(LATITUDE), float(LONGITUDE))

      T_lookup, R_lookup = get_tr(respiration_database=RESPIRATION_DB, fruit=FRUIT_TYPE)

      float64_dict, int8_dict, last_vals_float64_dict, last_vals_int8_dict = create_numba_dicts()

      FRUIT_CONFIG = FRUIT_CONFIGS[FRUIT_TYPE]

      M_DOT_AIR_THEORETICAL = FRUIT_CONFIG["m_dot_air_theoretical"]

      SIMULATION_CONFIG["tunnel_exit_fruit_temp"] = FRUIT_CONFIG["tunnel_exit_fruit_temp"]
      SIMULATION_CONFIG["Cp_fruit"] = FRUIT_CONFIG["Cp_fruit"]
      SIMULATION_CONFIG["k_p"] = FRUIT_CONFIG["k_p"]
      SIMULATION_CONFIG["setpoint"] = FRUIT_CONFIG["setpoint"]
      SIMULATION_CONFIG["target_rh"] = FRUIT_CONFIG["target_rh"]
      SIMULATION_CONFIG["m_max"] = FRUIT_CONFIG["m_max"]
      SIMULATION_CONFIG["Q_rated"] = FRUIT_CONFIG["Q_rated"]
      SIMULATION_CONFIG["TD_design"] = FRUIT_CONFIG["TD_design"]
      SIMULATION_CONFIG["k_zone_ref"] = FRUIT_CONFIG["k_zone_ref"]

      sim_params = SIMULATION_CONFIG.copy()
      sim_params["T_lookup"] = T_lookup
      sim_params["R_lookup"] = R_lookup
      sim_params["float64_dict"] = float64_dict
      sim_params["int8_dict"] = int8_dict
      sim_params["last_vals_float64_dict"] = last_vals_float64_dict
      sim_params["last_vals_int8_dict"] = last_vals_int8_dict

      timezone_id = get_timezone_name(LATITUDE, LONGITUDE)

      # Load current state
      raw_state = """{{ outputs.get_state.value }}"""
      print(repr(raw_state))
      state = json.loads(raw_state)

      start_dt = pd.Timestamp(state["next_start"])
      end_dt = "{{ inputs.end_date }}"
      end_dt = pd.Timestamp(end_dt) + pd.Timedelta(days=1)

      expected_date = datetime.strptime("{{ inputs.start_date }}", "%Y-%m-%d")

      assert start_dt.strftime("%Y-%m-%d") == expected_date.strftime("%Y-%m-%d"), "There is no simulation state from which to pick up the simulation. Please check the simulation state keys were initialized"

      active_batches = deserialize_active_batches(state["active_batches"])
      next_batch_id = state["next_batch_id"]

      is_first_run = np.int8(state["is_first_run"])
      cooling_call_init = np.int8(state["cooling_call_init"])
      humidifier_call_init = np.int8(state["humidifier_call_init"])
      cooling_frac_init = float(state["cooling_frac_init"])
      humidifier_frac_init = float(state["humidifier_frac_init"])
      condense_frac_init = float(state["condense_frac_init"])
      T_room_init = float(state["T_room_init"])
      T_sensor_init = float(state["T_sensor_init"])
      T_plant_init = float(state["T_plant_init"])
      T_plant_target_init = float(state["T_plant_target_init"])
      T_pulp_init = float(state["T_pulp_init"])
      CO2_ppm_init = float(state["CO2_ppm_init"])
      O2_pct_init = float(state["O2_pct_init"])
      W_room_init = float(state["W_room_init"])
      P_w_room_init = float(state["P_w_room_init"])
      RH_room_init = float(state["RH_room_init"])
      RH_room_sensor_init = float(state["RH_room_sensor_init"])
      W_coil_sat_init = float(state["W_coil_sat_init"])
      door_ext_open_fraction_init = float(state["door_ext_open_fraction_init"])
      door_int_open_fraction_init = float(state["door_int_open_fraction_init"])
      fruit_mass_kg_init = float(state["fruit_mass_kg_init"])
      total_water_loss_kg_init = float(state["total_water_loss_kg_init"])

      df = pd.read_parquet("{{ inputs.weather_seed_data }}")

      print(f"Simulating: {start_dt} -> {end_dt}")

      ## Run simulation

      # ----------------------------------
      # 1. Retrieve forcing
      # ---------------------------------- 

      forcing, localtime_reference, df_resampled, timestep, days_since_comp_installation_arr = prepare_forcing_arrays(df, **FORCING_CONFIG)

      SEED = create_seed(BASE_SEED, forcing["year"][0], forcing["month"][0], forcing["day_of_year"][0])

      # ----------------------------------
      # 2. Build schedules
      # ----------------------------------

      door_ext_schedule, door_int_schedule, fruit_mass_delta_kg, event_code, incoming_temperature_arr = build_door_and_mass_schedules(
          hour_arr=localtime_reference["hour"],
          minute_arr=localtime_reference["minute"],
          month_arr=localtime_reference["month"],
          year_arr=localtime_reference["year"],
          doy_arr=forcing["day_of_year"],
          fruit_type=FRUIT_TYPE,
          seed=SEED,
          **SCHEDULER_CONFIG,
      )

      # ----------------------------------
      # 3. Run simulator
      # ----------------------------------

      outputs_dict, calls_dict, last_outputs_dict, last_calls_dict = run_simulation_chunk(
          T_ambient_arr=forcing["T_ambient"],
          RH_ambient_arr=forcing["RH_ambient"],
          P_arr=forcing["P"],
          GHI_arr=forcing["GHI"],
          WS_arr=forcing["WS"],
          T2MDEW_arr=forcing["T2MDEW"],
          T_ground_arr=forcing["TSOIL_54CM"],

          hour_arr=forcing["hour"],
          minute_arr=forcing["minute"],
          second_arr=forcing["second"],
          doy_arr=forcing["day_of_year"],
          month_arr=forcing["month"],
          year_arr=forcing["year"],

          days_since_comp_installation_arr=days_since_comp_installation_arr,

          door_ext_schedule=door_ext_schedule,
          door_int_schedule=door_int_schedule,
          fruit_mass_delta_kg=fruit_mass_delta_kg,
          incoming_temperature_arr=incoming_temperature_arr,

          timestep=timestep,

          is_first_run=is_first_run,
          cooling_call_init=cooling_call_init,
          humidifier_call_init=humidifier_call_init,
          cooling_frac_init=cooling_frac_init,
          humidifier_frac_init=humidifier_frac_init,
          condense_frac_init=condense_frac_init,
          T_room_init=T_room_init,
          T_sensor_init=T_sensor_init,
          T_plant_init=T_plant_init,
          T_plant_target_init=T_plant_target_init,
          T_pulp_init=T_pulp_init,
          CO2_ppm_init=CO2_ppm_init,
          O2_pct_init=O2_pct_init,
          W_room_init=W_room_init,
          P_w_room_init=P_w_room_init,
          RH_room_init=RH_room_init,
          RH_room_sensor_init=RH_room_sensor_init,
          W_coil_sat_init=W_coil_sat_init,
          door_ext_open_fraction_init=door_ext_open_fraction_init,
          door_int_open_fraction_init=door_int_open_fraction_init,
          fruit_mass_kg_init=fruit_mass_kg_init,
          total_water_loss_kg_init=total_water_loss_kg_init,

          seed=SEED,
          **sim_params,
      )

      outputs_dict_py = {k: outputs_dict[k] for k in outputs_dict}
      calls_dict_py = {k: calls_dict[k] for k in calls_dict}
      last_outputs_dict_py = {k: last_outputs_dict[k] for k in last_outputs_dict}
      last_calls_dict_py = {k: last_calls_dict[k] for k in last_calls_dict}

      telemetry_dt_arr = expand_minute_timestamps_to_internal(
          forcing["dt_arr"],
          int(SIMULATION_CONFIG["dt_internal"])
      )
      telemetry_df = build_telemetry_table(
          plant_id=PLANT_ID,
          fruit_type=FRUIT_TYPE,
          telemetry_dt_arr=telemetry_dt_arr,
          outputs_dict=outputs_dict_py,
          calls_dict=calls_dict_py,
          seed=SEED,
          m_dot_air_theoretical=M_DOT_AIR_THEORETICAL,
          door_int_schedule=door_int_schedule,
          door_ext_schedule=door_ext_schedule,
          **TELEMETRY_CONFIG,
      )
      telemetry_df['loaded_at'] = pd.Timestamp.now()
      telemetry_df['timezone_id'] = timezone_id

      events_df, batches_df, active_batches, next_batch_id = build_batch_event_tables(
          plant_id=PLANT_ID,
          dt_arr=forcing["dt_arr"],
          fruit_mass_delta_kg=fruit_mass_delta_kg,
          incoming_temperature_arr=incoming_temperature_arr,
          fruit_type=FRUIT_TYPE,
          active_batches=active_batches,
          next_batch_id=next_batch_id,
          seed=SEED,
      )
      events_df['loaded_at'] = pd.Timestamp.now()
      batches_df['loaded_at'] = pd.Timestamp.now()

      events_df['timezone_id'] = timezone_id
      batches_df['timezone_id'] = timezone_id

      day_str = start_dt.strftime("%Y-%m-%d")
      hour_str = str(forcing["hour"][0]).zfill(2)

      telemetry_dir = LOCAL_OUT / "raw" / "telemetry" / f"date={day_str}"
      events_dir = LOCAL_OUT / "raw" / "events" / f"date={day_str}"
      batches_dir = LOCAL_OUT / "raw" / "batches" / f"date={day_str}"

      for d in [telemetry_dir, events_dir, batches_dir]:
          d.mkdir(parents=True, exist_ok=True)

      if len(events_df) == 0:
          events_df = pd.DataFrame(columns=[
              "plant_id",
              "timestamp",
              "event_type",
              "batch_id",
              "mass_kg",
              "fruit_type",
              "quality_grade",
              "tunnel_exit_temp_c",
              "loaded_at",
              "timezone_id",
          ])

      if len(batches_df) == 0:
          batches_df = pd.DataFrame(columns=[
              "plant_id",
              "batch_id",
              "fruit_type",
              "arrival_ts",
              "mass_kg_initial",
              "mass_kg_remaining",
              "tunnel_exit_temp_c",
              "quality_grade",
              "first_dispatch_ts",
              "final_dispatch_ts",
              "loaded_at",
              "timezone_id",
          ])

      telemetry_df = enforce_dtypes(telemetry_df, TELEMETRY_DTYPES["DTYPES"], TELEMETRY_DTYPES["DATETIME_COLS"])
      events_df = enforce_dtypes(events_df, EVENTS_DTYPES["DTYPES"], EVENTS_DTYPES["DATETIME_COLS"])
      batches_df = enforce_dtypes(batches_df, BATCHES_DTYPES["DTYPES"], BATCHES_DTYPES["DATETIME_COLS"])

      # telemetry_df = fix_timestamps(telemetry_df)
      # events_df = fix_timestamps(events_df)
      # batches_df = fix_timestamps(batches_df)

      telemetry_df.to_parquet(telemetry_dir / f"telemetry_{hour_str}.parquet", index=False)
      events_df.to_parquet(events_dir / f"events_{hour_str}.parquet", index=False)
      batches_df.to_parquet(batches_dir / f"batches_{hour_str}.parquet", index=False)

      new_state = {
          "next_start": end_dt.isoformat(),
          "next_batch_id": next_batch_id,
          "active_batches": serialize_active_batches(active_batches),

          "is_first_run": int(last_calls_dict_py["is_first_run"]),

          "cooling_call_init": int(last_calls_dict_py["cooling_call_init"]),
          "humidifier_call_init": int(last_calls_dict_py["humidifier_call_init"]),
          "cooling_frac_init": float(last_outputs_dict_py["cooling_frac_init"]),
          "humidifier_frac_init": float(last_outputs_dict_py["humidifier_frac_init"]),
          "condense_frac_init": float(last_outputs_dict_py["condense_frac_init"]),

          "T_room_init": float(last_outputs_dict_py["T_room_init"]),
          "T_sensor_init": float(last_outputs_dict_py["T_sensor_init"]),
          "T_plant_init": float(last_outputs_dict_py["T_plant_init"]),
          "T_plant_target_init": float(last_outputs_dict_py["T_plant_target_init"]),
          "T_pulp_init": float(last_outputs_dict_py["T_pulp_init"]),

          "CO2_ppm_init": float(last_outputs_dict_py["CO2_ppm_init"]),
          "O2_pct_init": float(last_outputs_dict_py["O2_pct_init"]),

          "W_room_init": float(last_outputs_dict_py["W_room_init"]),
          "P_w_room_init": float(last_outputs_dict_py["P_w_room_init"]),
          "RH_room_init": float(last_outputs_dict_py["RH_room_init"]),
          "RH_room_sensor_init": float(last_outputs_dict_py["RH_room_sensor_init"]),
          "W_coil_sat_init": float(last_outputs_dict_py["W_coil_sat_init"]),

          "door_ext_open_fraction_init": float(last_outputs_dict_py["door_ext_open_fraction_init"]),
          "door_int_open_fraction_init": float(last_outputs_dict_py["door_int_open_fraction_init"]),
          
          "fruit_mass_kg_init": float(last_outputs_dict_py["fruit_mass_kg_init"]),
          "total_water_loss_kg_init": float(last_outputs_dict_py["total_water_loss_kg_init"])
      }
      with open("updated_state.json", "w") as f:
          json.dump(new_state, f, indent=2)
      print(f"Completed chunk {start_dt} -> {end_dt}")

  - id: save_simulation_state
    type: io.kestra.plugin.core.kv.Set
    key: "simulation_state_{{ inputs.fruit_type }}"
    kvType: STRING
    value: "{{ read(outputs.simulator.outputFiles['updated_state.json']) }}"

  - id: parallel_processing
    type: io.kestra.plugin.core.flow.Parallel
    retry:
      type: constant
      interval: PT1M
      maxDuration: PT10M
      maxAttempts: 3
      warningOnRetry: true
    tasks:
      - id: upload_telemetry
        type: io.kestra.plugin.gcp.gcs.Upload
        from: "{{ outputs.simulator.outputFiles['raw/telemetry/date=' ~ inputs.start_date ~ '/telemetry_00.parquet'] }}"
        to: "gs://{{kv('GCP_BUCKET_NAME')}}/raw/telemetry/year={{ inputs.start_date | date('yyyy') }}/month={{ inputs.start_date | date('MM') }}/day={{ inputs.start_date | date('dd') }}/telemetry_{{ inputs.fruit_type }}.parquet"

      - id: upload_events
        type: io.kestra.plugin.gcp.gcs.Upload
        from: "{{ outputs.simulator.outputFiles['raw/events/date=' ~ inputs.start_date ~ '/events_00.parquet'] }}"
        to: "gs://{{kv('GCP_BUCKET_NAME')}}/raw/events/year={{ inputs.start_date | date('yyyy') }}/month={{ inputs.start_date | date('MM') }}/day={{ inputs.start_date | date('dd') }}/events_{{ inputs.fruit_type }}.parquet"

      - id: upload_batches
        type: io.kestra.plugin.gcp.gcs.Upload
        from: "{{ outputs.simulator.outputFiles['raw/batches/date=' ~ inputs.start_date ~ '/batches_00.parquet'] }}"
        to: "gs://{{kv('GCP_BUCKET_NAME')}}/raw/batches/year={{ inputs.start_date | date('yyyy') }}/month={{ inputs.start_date | date('MM') }}/day={{ inputs.start_date | date('dd') }}/batches_{{ inputs.fruit_type }}.parquet"

