id: healing_flow
namespace: chao_cold_storage

inputs:
  - id: start_date
    type: DATE

  - id: fruit_types
    type: ARRAY
    itemType: STRING

  - id: frequency
    type: STRING

  - id: is_test
    type: BOOL

  - id: seed
    type: INT

pluginDefaults:
  - type: io.kestra.plugin.gcp
    values:
      serviceAccount: "{{secret('GCP_SERVICE_ACCOUNT')}}"
      projectId: "{{kv('GCP_PROJECT_ID')}}"
      location: "{{kv('GCP_LOCATION')}}"
      bucket: "{{kv('GCP_BUCKET_NAME')}}"

tasks:
  - id: mark_historical_data_generation_as_incomplete
    type: io.kestra.plugin.core.kv.Set
    key: "backfill_complete"
    kvType: BOOLEAN
    value: "false"

  - id: fill_gaps_mismatched
    type: io.kestra.plugin.core.flow.Subflow
    flowId: mismatched_gap_filling
    namespace: chao_cold_storage
    wait: true
    transmitFailed: true
    runIf: "{{ kv('pipeline_diagnostics') == 'needs_healing_mismatched' }}"
    inputs:
      fruit_types: "{{ inputs.fruit_types }}"
      seed: "{{ inputs.seed }}"
      frequency: "{{ inputs.frequency }}"

  - id: fill_gaps_matched
    type: io.kestra.plugin.core.flow.Subflow
    flowId: manual_backfill_historical
    namespace: chao_cold_storage
    wait: true
    transmitFailed: true
    runIf: "{{ kv('pipeline_diagnostics') == 'needs_healing_matched' }}"
    inputs:
      start_date: "{{ inputs.start_date }}"
      fruit_types: "{{ inputs.fruit_types }}"
      seed: "{{ inputs.seed }}"
      frequency: "{{ inputs.frequency }}"

  - id: exit_message
    type: io.kestra.plugin.core.log.Log
    message: "Healing flow successfully completed. 'Til next month! Exiting main flow..."

