id: retrieve_satellite_data
namespace: blueberry_cold_storage

inputs:
  - id: start_date
    type: STRING
    description: "Start date of the month, e.g. 2022-01-01"

  - id: frequency
    type: STRING
    defaults: "hourly"

pluginDefaults:
  - type: io.kestra.plugin.gcp
    values:
      serviceAccount: "{{secret('GCP_SERVICE_ACCOUNT')}}"
      projectId: "{{kv('GCP_PROJECT_ID')}}"
      location: "{{kv('GCP_LOCATION')}}"
      bucket: "{{kv('GCP_BUCKET_NAME')}}"

tasks:
  - id: download_satellite_data
    type: io.kestra.plugin.scripts.python.Script
    containerImage: blueberry_simulator:v001
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    namespaceFiles:
      enabled: true
    outputFiles:
      - "satellite_data.parquet"
    script: |
      import pandas as pd
      from config import LOCATION, RETRIEVAL_CONFIG, WEATHER_DATASET_DTYPES
      from simulator import retrieve_satellite_data, get_timezone_name, fix_timestamps, encode_coordinates

      start_dt = "{{ inputs.start_date }}"
      end_dt = (pd.Timestamp(start_dt) + pd.offsets.MonthEnd(0)).strftime("%Y-%m-%d")
      print(f"Retrieving satellite data: {start_dt} -> {end_dt}")

      LATITUDE = LOCATION["latitude"]
      LONGITUDE = LOCATION["longitude"]

      df = retrieve_satellite_data(
          start_dt=start_dt,
          end_dt=end_dt,
          latitude=LATITUDE,
          longitude=LONGITUDE,
          dtypes=WEATHER_DATASET_DTYPES,
          frequency="{{ inputs.frequency }}",
          **RETRIEVAL_CONFIG,
      )
      df['loaded_at'] = pd.Timestamp.now()
      df['timezone_id'] = get_timezone_name(LATITUDE, LONGITUDE)

      df = fix_timestamps(df)
      
      df.to_parquet("satellite_data.parquet")
      print(f"Retrieved {len(df)} rows")

outputs:
  - id: out_parquet
    type: FILE
    value: "{{ outputs.download_satellite_data.outputFiles['satellite_data.parquet'] }}"