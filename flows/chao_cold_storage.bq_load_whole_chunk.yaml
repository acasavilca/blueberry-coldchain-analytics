id: bq_load_whole_chunk
namespace: chao_cold_storage

inputs:
  - id: date
    type: DATE
    description: date for which data was retrieved or generated.

pluginDefaults:
  - type: io.kestra.plugin.gcp
    values:
      serviceAccount: "{{secret('GCP_SERVICE_ACCOUNT')}}"
      projectId: "{{kv('GCP_PROJECT_ID')}}"
      location: "{{kv('GCP_LOCATION')}}"

tasks:
  - id: create_telemetry
    type: io.kestra.plugin.gcp.cli.GCloudCLI
    namespaceFiles:
      enabled: true
    commands:
      - >
        bq load --noreplace --source_format=PARQUET
        {{kv('GCP_RAW_DATASET')}}.telemetry
        gs://{{kv('GCP_BUCKET_NAME')}}/raw/telemetry/**/*.parquet

  - id: create_events
    type: io.kestra.plugin.gcp.cli.GCloudCLI
    namespaceFiles:
      enabled: true
    commands:
      - >
        bq load --noreplace --source_format=PARQUET
        {{kv('GCP_RAW_DATASET')}}.events
        gs://{{kv('GCP_BUCKET_NAME')}}/raw/events/**/*.parquet

  - id: create_batches
    type: io.kestra.plugin.gcp.cli.GCloudCLI
    namespaceFiles:
      enabled: true
    commands:
      - >
        bq load --noreplace --source_format=PARQUET
        {{kv('GCP_RAW_DATASET')}}.batches
        gs://{{kv('GCP_BUCKET_NAME')}}/raw/batches/**/*.parquet

  - id: create_satellite
    type: io.kestra.plugin.gcp.cli.GCloudCLI
    namespaceFiles:
      enabled: true
    commands:
      - >
        bq load --noreplace --source_format=PARQUET
        {{kv('GCP_RAW_DATASET')}}.satellite
        gs://{{kv('GCP_BUCKET_NAME')}}/raw/satellite/**/*.parquet
