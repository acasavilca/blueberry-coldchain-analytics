id: generate_keys
namespace: chao_cold_storage

labels:
  mute_alerts: "true"

tasks:
  - id: gcp_project_id
    type: io.kestra.plugin.core.kv.Set
    key: GCP_PROJECT_ID
    kvType: STRING
    value: fruit-packing-plant-simulator # TODO replace with your project id

  - id: gcp_location
    type: io.kestra.plugin.core.kv.Set
    key: GCP_LOCATION
    kvType: STRING
    value: US

  - id: gcp_bucket_name
    type: io.kestra.plugin.core.kv.Set
    key: GCP_BUCKET_NAME
    kvType: STRING
    value: kestra-cold-storage-data-generator # TODO make sure it's globally unique!

  - id: gcp_raw_dataset
    type: io.kestra.plugin.core.kv.Set
    key: GCP_RAW_DATASET
    kvType: STRING
    value: raw

  - id: gcp_dataset
    type: io.kestra.plugin.core.kv.Set
    key: GCP_DATASET
    kvType: STRING
    value: prod

  - id: init_initialization_flag
    type: io.kestra.plugin.core.kv.Set
    key: "is_initialized"
    kvType: BOOLEAN
    value: "false"

  - id: init_backfill_flag
    type: io.kestra.plugin.core.kv.Set
    key: "backfill_complete"
    kvType: BOOLEAN
    value: "false"

  - id: system_keys
    type: io.kestra.plugin.core.flow.Subflow
    namespace: system
    wait: true
    transmitFailed: true
    labels:
      mute_alerts: true
    flowId: gen_system_keys

