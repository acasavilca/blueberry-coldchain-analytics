id: dbt_build
namespace: blueberry_cold_storage

tasks:
  - id: upload_dbt_project
    type: io.kestra.plugin.core.flow.WorkingDirectory
    tasks:
      - id: clone_repository
        type: io.kestra.plugin.git.Clone
        url: https://github.com/acasavilca/blueberry-coldchain-analytics
        branch: master

      - id: upload
        type: io.kestra.plugin.core.namespace.UploadFiles
        namespace: "{{ flow.namespace }}"
        files:
          - "glob:**/dbt/**"

  - id: create_dbt_profile
    type: io.kestra.plugin.scripts.shell.Commands
    commands:
      - |
        mkdir -p /root/.dbt
        cat > /root/.dbt/profiles.yml << EOF
        dbt:
          target: prod
          outputs:
            prod:
              type: bigquery
              method: service-account-json
              project: {{kv('GCP_PROJECT_ID')}}
              dataset: {{kv('GCP_DATASET')}}
              location: {{kv('GCP_LOCATION')}}
              keyfile_json: {{secret('GCP_SERVICE_ACCOUNT')}}
              threads: 4
        EOF

  - id: dbt_build
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: ghcr.io/dbt-labs/dbt-bigquery:1.8.0
    taskRunner:
        type: io.kestra.plugin.scripts.runner.docker.Docker
    commands:
        - cd blueberry-coldchain-analytics/dbt
        - dbt build --profiles-dir /root/.dbt

