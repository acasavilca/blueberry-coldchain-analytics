id: retrieve_satellite_data
namespace: chao_cold_storage

inputs:
  - id: start_date
    type: DATE
    description: "Starting date for weather data retrieval"

  - id: end_date
    type: DATE
    description: "Last date for weather data retrieval"

  - id: is_backfill
    type: BOOL
    defaults: false

  - id: frequency
    type: STRING
    defaults: "hourly"

concurrency:
  limit: 5
  behavior: QUEUE

pluginDefaults:
  - type: io.kestra.plugin.gcp
    values:
      serviceAccount: "{{secret('GCP_SERVICE_ACCOUNT')}}"
      projectId: "{{kv('GCP_PROJECT_ID')}}"
      location: "{{kv('GCP_LOCATION')}}"
      bucket: "{{kv('GCP_BUCKET_NAME')}}"

tasks:
  - id: download_satellite_data
    type: io.kestra.plugin.scripts.python.Script
    containerImage: blueberry_simulator:v001
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    namespaceFiles:
      enabled: true
    retry:
      type: constant
      interval: PT1M
      maxDuration: PT10M
      maxAttempts: 3
      warningOnRetry: true
    outputFiles:
      - "satellite/**"
    script: |
      import pandas as pd
      from config import LOCATION, RETRIEVAL_CONFIG, WEATHER_DATASET_DTYPES
      from simulator import (
          retrieve_satellite_data,
          get_timezone_name,
          fix_timestamps,
          encode_coordinates,
          split_df_into_daily_parquets
      )

      start_dt = "{{ inputs.start_date }}"
      # end_dt = (pd.Timestamp(start_dt) + pd.offsets.MonthEnd(0)).strftime("%Y-%m-%d")
      end_dt = "{{ inputs.end_date }}"
      print(f"Retrieving satellite data: {start_dt} -> {end_dt}")

      LATITUDE = LOCATION["latitude"]
      LONGITUDE = LOCATION["longitude"]

      is_backfill = bool("{{ inputs.is_backfill ? 'True' : 'False' }}")
      if is_backfill:
        print('Backfill running')

      df = retrieve_satellite_data(
          start_dt=start_dt,
          end_dt=end_dt,
          latitude=LATITUDE,
          longitude=LONGITUDE,
          dtypes=WEATHER_DATASET_DTYPES,
          frequency="{{ inputs.frequency }}",
          is_backfill=is_backfill,
          **RETRIEVAL_CONFIG,
      )
      # df['loaded_at'] = pd.Timestamp.now()
      df['timezone_id'] = get_timezone_name(LATITUDE, LONGITUDE)
      print(f"Retrieved {len(df)} rows")

      status_message = split_df_into_daily_parquets(df)
      print(status_message)

  - id: upload_loop
    type: io.kestra.plugin.core.flow.ForEach
    values: "{{ outputs.download_satellite_data.outputFiles | keys }}"
    tasks:
      - id: upload_satellite_data
        type: io.kestra.plugin.gcp.gcs.Upload
        from: "{{ outputs.download_satellite_data.outputFiles[taskrun.value] }}"
        to: "gs://{{kv('GCP_BUCKET_NAME')}}/raw/{{ taskrun.value }}"
