id: monthly_run
namespace: chao_cold_storage

inputs:
  - id: start_date
    type: DATE
    description: "Start date of the month, e.g. 2025-03-01"

  - id: end_date
    type: DATE
    description: "Start date of the month, e.g. 2025-03-01"

  - id: frequency
    type: STRING
    defaults: "hourly"

  - id: seed
    type: INT
    defaults: 42

  - id: fruit_types
    type: ARRAY
    itemType: STRING
    defaults: ["blueberry", "avocado"]
    description: "List of fruits for which to generate data. Only blueberries and avocados, high-value crops intensively farmed at this location (Chao, Peru), are available for now."

  - id: weather_seed_data
    type: FILE
  

pluginDefaults:
  - type: io.kestra.plugin.gcp
    values:
      serviceAccount: "{{secret('GCP_SERVICE_ACCOUNT')}}"
      projectId: "{{kv('GCP_PROJECT_ID')}}"
      location: "{{kv('GCP_LOCATION')}}"
      bucket: "{{kv('GCP_BUCKET_NAME')}}"

tasks:
  - id: iterate_fruits
    type: io.kestra.plugin.core.flow.ForEach
    concurrencyLimit: 1
    values: "{{ inputs.fruit_types }}"
    tasks:
      - id: run_monthly_update
        type: io.kestra.plugin.core.flow.Subflow
        flowId: monthly_simulator
        namespace: chao_cold_storage
        wait: true
        transmitFailed: true
        inputs:
          start_date: "{{ inputs.start_date }}"
          end_date: "{{ inputs.end_date }}"
          frequency: "{{ inputs.frequency }}"
          seed: "{{ inputs.seed }}"
          fruit_type: "{{ taskrun.value }}"
          weather_seed_data: "{{ inputs.weather_seed_data }}"


