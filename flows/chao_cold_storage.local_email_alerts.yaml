id: local_email_alerts
namespace: chao_cold_storage

inputs:
  - id: month
    type: STRING

  - id: is_healing_run
    type: BOOLEAN

  - id: parent_flow_id
    type: STRING

  - id: parent_execution_id
    type: STRING

  - id: parent_namespace
    type: STRING

tasks:
  - id: craft_custom_message
    type: io.kestra.plugin.core.debug.Return
    format: |
      {% if inputs.is_healing_run == true %}
        <h3>Historical backfill is not up to date. Healing flow up to and including {{ inputs.month }} has STARTED 🩹 </h3>
        <p><strong>Flow:</strong> {{ inputs.parent_flow_id }}</p>
        <p><strong>Execution ID:</strong> {{ inputs.parent_execution_id }}</p>
        <p><a href="{{ kestra.url }}ui/main/executions/{{ inputs.parent_namespace }}/{{ inputs.parent_flow_id }}/{{ inputs.parent_execution_id }}/gantt">Click here to view your progress.</a></p>

      {% else %}
        <h3>Monthly flow for {{ inputs.month }} has STARTED 🚀 </h3>
        <p><strong>Flow:</strong> {{ inputs.parent_flow_id }}</p>
        <p><strong>Execution ID:</strong> {{ inputs.parent_execution_id }}</p>
        <p><a href="{{ kestra.url }}ui/main/executions/{{ inputs.parent_namespace }}/{{ inputs.parent_flow_id }}/{{ inputs.parent_execution_id }}/gantt">Click here to view your progress.</a></p>
      {% endif %}

  - id: send_email_notification
    type: io.kestra.plugin.email.MailSend
    from: "{{ kv('MY_GMAIL') }}"
    to: "{{ kv('MY_GMAIL') }}"
    subject: "Fruit cold storage pipeline montly notification"
    host: smtp.gmail.com
    port: 465
    username: "{{ kv('MY_GMAIL') }}"
    password: "{{ secret('EMAIL_PASSWORD') }}"
    retry:
      type: constant
      interval: PT1M
      maxDuration: PT5M
      maxAttempts: 3
      warningOnRetry: true
    htmlTextContent: "{{ outputs.craft_custom_message.value }}"
