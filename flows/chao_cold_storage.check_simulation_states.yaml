id: check_simulation_states
namespace: chao_cold_storage

inputs:
  - id: start_date
    type: DATE

  - id: fruit_types
    type: ARRAY
    itemType: STRING
    defaults: ['blueberry', 'avocado']

pluginDefaults:
  - type: io.kestra.plugin.gcp
    values:
      serviceAccount: "{{secret('GCP_SERVICE_ACCOUNT')}}"
      projectId: "{{kv('GCP_PROJECT_ID')}}"
      location: "{{kv('GCP_LOCATION')}}"
      bucket: "{{kv('GCP_BUCKET_NAME')}}"

tasks:
  - id: iterate_fruits
    type: io.kestra.plugin.core.flow.ForEach
    concurrencyLimit: 1
    values: "{{ inputs.fruit_types }}"
    tasks:
    - id: get_state
      type: io.kestra.plugin.core.kv.Get
      key: "simulation_state_{{ taskrun.value }}"
      errorOnMissing: false

  - id: run_diagnostics
    type: io.kestra.plugin.scripts.python.Script
    containerImage: blueberry_simulator:v001
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    namespaceFiles:
      enabled: true
    env:
      RAW_OUTPUTS: "{{ outputs | json }}"
    outputFiles:
      - diagnostics.txt
      - min_start_date.txt
    script: |
      import os
      import json
      import numpy as np
      
      simulation_states = json.loads(os.environ.get('RAW_OUTPUTS'))
      simulation_states = simulation_states["get_state"]

      string_dates = []

      for fruit in simulation_states.keys():
          raw_val = simulation_states[fruit].get("value")
          # Parse the stringified JSON into a real dict
          parsed_val = json.loads(raw_val)
          next_start = parsed_val.get("next_start")
          string_dates.append(next_start[:10])
          
          # Now this won't crash your script:
          print(parsed_val.get("next_start"))

      string_dates = ['2025-02-01', '2024-02-01'] ### DELETE

      states_date_arr = np.array(string_dates, dtype='datetime64[D]')

      input_date = "{{ inputs.start_date }}"
      input_date = np.array(input_date, dtype='datetime64[D]')
      
      if len(np.unique(states_date_arr)) == 1:
          if states_date_arr[0] == input_date:
              key_value = 'normal_run'
          elif states_date_arr[0] < input_date:
              key_value = 'needs_healing_matched'
          else:
              key_value = 'needs_manual_repair'
      else:
          if np.max(states_date_arr) <= input_date:
              key_value = 'needs_healing_mismatched'
              min_start_date = np.min(states_date_arr)
          else:
              key_value = 'needs_manual_repair'

      with open("diagnostics.txt", "w") as f:
          f.write(key_value)

      if key_value == 'needs_healing_mismatched':
        min_start_date = np.datetime_as_string(min_start_date)
        with open("min_start_date.txt", "w") as f:
            f.write(f"{min_start_date}T00:00:00Z" )

  - id: save_to_kestra_kv
    type: io.kestra.plugin.core.kv.Set
    key: "pipeline_diagnostics"
    kvType: STRING
    value: "{{ read(outputs.run_diagnostics.outputFiles['diagnostics.txt']) }}"

  - id: save_min_start_date_kv
    type: io.kestra.plugin.core.kv.Set
    runIf: "{{ kv('pipeline_diagnostics') == 'needs_healing_mismatched' }}"
    key: "min_start_date"
    kvType: DATE
    value: "{{ read(outputs.run_diagnostics.outputFiles['min_start_date.txt']) }}"

  - id: mark_historical_data_generation_as_incomplete
    type: io.kestra.plugin.core.kv.Set
    runIf: "{{ kv('pipeline_diagnostics') != 'normal_run' }}"
    key: "backfill_complete"
    kvType: BOOLEAN
    value: "false"
