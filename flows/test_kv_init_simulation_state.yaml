id: test_kv_init_simulation_state
namespace: blueberry_cold_storage

inputs:
  - id: start_of_operations
    type: STRING
    description: "the month when the cold storage room started operating or recording data"
    defaults: "2022-01-01"

  - id: fruit_types
    type: ARRAY
    itemType: STRING
    defaults: ["blueberry", "avocado"]
    description: "List of fruits for which to generate data"

tasks:
  - id: init_simulation_state_per_fruit
    type: io.kestra.plugin.core.flow.ForEach
    concurrencyLimit: 0
    values: "{{ inputs.fruit_types }}"
    tasks:
      - id: init_simulation_state
        type: io.kestra.plugin.core.kv.Set
        key: "simulation_state_{{ taskrun.value }}"
        kvType: STRING
        value:  '{"next_start":"{{ inputs.start_of_operations }}T00:00:00","next_batch_id":1,"active_batches":[]}'