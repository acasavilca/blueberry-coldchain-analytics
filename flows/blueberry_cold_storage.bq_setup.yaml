id: bq_setup
namespace: blueberry_cold_storage

pluginDefaults:
  - type: io.kestra.plugin.gcp
    values:
      serviceAccount: "{{secret('GCP_SERVICE_ACCOUNT')}}"
      projectId: "{{kv('GCP_PROJECT_ID')}}"
      location: "{{kv('GCP_LOCATION')}}"

tasks:
  - id: create_telemetry
    type: io.kestra.plugin.gcp.cli.GCloudCLI
    namespaceFiles:
      enabled: true
    commands:
      - >
        bq show {{kv('GCP_RAW_DATASET')}}.telemetry > /dev/null 2>&1 ||
        bq mk --table
        --time_partitioning_field=datetime
        --time_partitioning_type=DAY
        --clustering_fields=plant_id,fruit_type
        {{kv('GCP_RAW_DATASET')}}.telemetry
        ./telemetry.json

  - id: create_events
    type: io.kestra.plugin.gcp.cli.GCloudCLI
    namespaceFiles:
      enabled: true
    commands:
      - >
        bq show {{kv('GCP_RAW_DATASET')}}.events > /dev/null 2>&1 ||
        bq mk --table
        --time_partitioning_field=timestamp
        --time_partitioning_type=DAY
        --clustering_fields=fruit_type,quality_grade
        {{kv('GCP_RAW_DATASET')}}.events
        ./events.json

  - id: create_batches
    type: io.kestra.plugin.gcp.cli.GCloudCLI
    namespaceFiles:
      enabled: true
    commands:
      - >
        bq show {{kv('GCP_RAW_DATASET')}}.batches > /dev/null 2>&1 ||
        bq mk --table
        --time_partitioning_field=arrival_ts
        --time_partitioning_type=DAY
        --clustering_fields=fruit_type,quality_grade
        {{kv('GCP_RAW_DATASET')}}.batches
        ./batches.json

  - id: create_satellite
    type: io.kestra.plugin.gcp.cli.GCloudCLI
    namespaceFiles:
      enabled: true
    commands:
      - >
        bq show {{kv('GCP_RAW_DATASET')}}.satellite > /dev/null 2>&1 ||
        bq mk --table
        --time_partitioning_field=datetime
        --time_partitioning_type=DAY
        --clustering_fields=location_id
        {{kv('GCP_RAW_DATASET')}}.satellite
        ./satellite.json

  - id: mark_bq_tables_as_created
    type: io.kestra.plugin.core.kv.Set
    runIf: "{{ kv('bq_tables_created') == 'false' }}"
    key: "bq_tables_created"
    value: "true"

