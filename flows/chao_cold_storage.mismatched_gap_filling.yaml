id: mismatched_gap_filling
namespace: chao_cold_storage

inputs:
  - id: fruit_types
    type: ARRAY
    itemType: STRING

  - id: frequency
    type: STRING

  - id: is_test
    type: BOOL

  - id: seed
    type: INT

pluginDefaults:
  - type: io.kestra.plugin.gcp
    values:
      serviceAccount: "{{secret('GCP_SERVICE_ACCOUNT')}}"
      projectId: "{{kv('GCP_PROJECT_ID')}}"
      location: "{{kv('GCP_LOCATION')}}"
      bucket: "{{kv('GCP_BUCKET_NAME')}}"

tasks:
  - id: iterate_fruits
    type: io.kestra.plugin.core.flow.ForEach
    concurrencyLimit: 1
    values: "{{ inputs.fruit_types }}"
    tasks:
      - id: fetch_json
        type: io.kestra.plugin.core.kv.Get
        key: "simulation_state_{{ taskrun.value }}"
        errorOnMissing: false

      - id: generate_month_list
        type: io.kestra.plugin.scripts.python.Script
        containerImage: blueberry_simulator:v001
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
        namespaceFiles:
          enabled: true
        env:
          START_DATE: >-
            {{ currentEachOutput(outputs.fetch_json).value is not null
               ? (currentEachOutput(outputs.fetch_json).value | json).next_start | date('yyyy-MM-dd')
               : '2022-01-01' }}
        script: |
          from datetime import datetime
          from dateutil.relativedelta import relativedelta
          from kestra import Kestra
          import os

          # Parse input and get current time
          start_date_str = os.environ["START_DATE"]
          print(f"Processing loop with start date: {start_date_str}")

          start = datetime.strptime(start_date_str, "%Y-%m-%d")
          end = (datetime.now() - relativedelta(months=1)).replace(day=1)
    
          months = []
          current = start.replace(day=1)
    
          while current <= end:
              months.append(current.strftime("%Y-%m"))
              current += relativedelta(months=1)
    
          # Export the list so the next task can see it
          Kestra.outputs({'month_range': months})
          Kestra.outputs({"resolved_start": start_date_str})

      - id: send_email_notification
        type: io.kestra.plugin.email.MailSend
        runIf: "{{ currentEachOutput(outputs.fetch_json).value is null }}"
        from: "{{ kv('MY_GMAIL') }}"
        to: "{{ kv('MY_GMAIL') }}"
        subject: "Missing simulation state for {{ taskrun.value }}"
        host: smtp.gmail.com
        port: 465
        username: "{{ kv('MY_GMAIL') }}"
        password: "{{ secret('EMAIL_PASSWORD') }}"
        allowFailure: true
        retry:
          type: constant
          interval: PT1M
          maxDuration: PT5M
          maxAttempts: 3
          warningOnRetry: true
        htmlTextContent: >-
          <div>
            <h3>Simulation state key for {{ taskrun.value }} was not found 👀 </h3>
            <p>The default 'start of operations date' to generate complete historical data is:
              <strong>{{ currentEachOutput(outputs.generate_month_list).vars.resolved_start }}</strong>
          <div>

      - id: initialize_workflow
        type: io.kestra.plugin.core.flow.Subflow
        flowId: initialization_tasks
        namespace: chao_cold_storage
        wait: true
        transmitFailed: true
        retry:
          type: constant
          interval: PT1M
          maxDuration: PT10M
          maxAttempts: 5
          warningOnRetry: true
        runIf: "{{ kv('is_initialized') == false }}"
        inputs:
          start_date: "{{ currentEachOutput(outputs.generate_month_list).vars.resolved_start }}"
          fruit_types: "{{ taskrun.value }}"
    
      - id: iterate_months
        type: io.kestra.plugin.core.flow.ForEach
        concurrencyLimit: 1
        values: "{{ currentEachOutput(outputs.generate_month_list).vars.month_range }}"
        tasks:
          - id: download_satellite_data
            type: io.kestra.plugin.core.flow.Subflow
            flowId: retrieve_satellite_data
            namespace: chao_cold_storage
            wait: true
            transmitFailed: true
            inputs:
              start_date: "{{ taskrun.value }}-01"
              frequency: "{{ inputs.frequency }}"

          - id: run_monthly_update
            type: io.kestra.plugin.core.flow.Subflow
            flowId: monthly_simulator
            namespace: chao_cold_storage
            wait: true
            transmitFailed: true
            inputs:
              start_date: "{{ taskrun.value }}-01"
              frequency: "{{ inputs.frequency }}"
              seed: "{{ inputs.seed }}"
              fruit_type: "{{ parents[0].taskrun.value }}"
              weather_seed_data: "{{ currentEachOutput(outputs.download_satellite_data).outputs.out_parquet }}"

          - id: upload_satellite_data
            type: io.kestra.plugin.gcp.gcs.Upload
            from: "{{ currentEachOutput(outputs.download_satellite_data).outputs.out_parquet }}"
            to: "gs://{{kv('GCP_BUCKET_NAME')}}/raw/satellite/month={{ taskrun.value }}/satellite_data.parquet"
            runIf: "{{ currentEachOutput(outputs.generate_month_list).vars.resolved_start == kv('min_start_date') }}"
            retry:
              type: constant
              interval: PT1M
              maxDuration: PT10M
              maxAttempts: 3
              warningOnRetry: true

          - id: append_raw_bq_tables
            type: io.kestra.plugin.core.flow.Subflow
            flowId: bq_load_incremental
            namespace: chao_cold_storage
            wait: true
            transmitFailed: true
            retry:
              type: constant
              interval: PT1M
              maxDuration: PT10M
              maxAttempts: 3
              warningOnRetry: true
            inputs:
              month: "{{ taskrun.value }}"

      - id: execute_dbt
        type: io.kestra.plugin.core.flow.Subflow
        flowId: dbt_build
        runIf: "{{ inputs.is_test == false }}"
        namespace: chao_cold_storage
        retry:
          type: constant
          interval: PT1M
          maxDuration: PT20M
          maxAttempts: 3
          warningOnRetry: true
        inputs:
          start_date: "{{ currentEachOutput(outputs.generate_month_list).vars.resolved_start }}"

  - id: mark_historical_data_generation_as_complete
    type: io.kestra.plugin.core.kv.Set
    key: "backfill_complete"
    kvType: BOOLEAN
    value: "true"