id: manual_backfill_historical
namespace: chao_cold_storage

description: |
  Administrative initialization flow for Chao (Peru) telemetry platform. 
  Generates the dynamic monthly range array from a past start date up to 
  the previous month, executing a sequential, state-protected loop 
  to load historical cold storage data prior to scheduled production runs.

inputs:
  - id: start_date
    type: DATE
    description: "The day the cold storage room started operating or recording data. Kestra will jump to first day of selectedmonth to for compatibility with the rest of the code"
    defaults: "2022-01-01"

  - id: fruit_types
    type: ARRAY
    itemType: STRING
    defaults: ["blueberry", "avocado"]
    description: "List of fruits for which to generate data. Only blueberries and avocados, high-value crops intensively farmed at this location (Chao, Peru), are available for now."

  - id: is_test
    type: BOOL
    description: "Set to false for regular runs"

  - id: silence_alerts
    type: BOOL
    defaults: false
    description: "Choose whether to silence email alerts. NOTE: Manual backfill fill result in alerts for every task run in each iteration."

  - id: user_timezone
    type: SELECT
    allowCustomValue: true   # <--- This enables typing a custom value
    values:
      - UTC
      - America/Lima
      - America/New_York
      - America/Los_Angeles
      - Europe/London
      - Asia/Tokyo
    defaults: America/Lima
    description: "Select from the list or type your own timezone identifier."

labels:
  mute_alerts: "{{ inputs.silence_alerts }}"
  environment: production
  layer: administrative

variables:
  frequency: "hourly"
  seed: 42

pluginDefaults:
  - type: io.kestra.plugin.gcp
    values:
      serviceAccount: "{{secret('GCP_SERVICE_ACCOUNT')}}"
      projectId: "{{kv('GCP_PROJECT_ID')}}"
      location: "{{kv('GCP_LOCATION')}}"
      bucket: "{{kv('GCP_BUCKET_NAME')}}"

tasks:
  - id: check_historical_data_generation
    type: io.kestra.plugin.core.execution.Fail
    # The condition is written as a Pebble expression
    condition: "{{ kv('backfill_complete') == true }}"
    errorMessage: "Historical data has already been generated. If you wish to re-generated the data, delete all the keys, and run generate_keys.yaml again. Destroying and re-creating your GCP resources is also recommended."

  - id: generate_lists
    type: io.kestra.plugin.scripts.python.Script
    containerImage: blueberry_simulator:v001
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    namespaceFiles:
      enabled: true
    script: |
      from datetime import datetime
      from dateutil.relativedelta import relativedelta
      from kestra import Kestra

      # Parse input and get current time
      start = datetime.strptime("{{ inputs.start_date }}", "%Y-%m-%d")
      end = datetime.now() - relativedelta(days=1)
      end = end.combine(end, end.min.time())

      months = []
      days = []

      # current = start.replace(day=1)
      # months.append(start.strftime("%Y-%m-%d"))
      # current += relativedelta(months=1)

      # month loop
      current = start
      while current < end:
          months.append(current.strftime("%Y-%m-%d"))
          current += relativedelta(months=1)

      # day loop
      current = start
      while current <= end:
          days.append(current.strftime("%Y-%m-%d"))
          current += relativedelta(days=1)

      # Export the list so the next task can see it
      Kestra.outputs({'month_range': months})
      Kestra.outputs({'day_range': days})

  - id: initialize_workflow
    type: io.kestra.plugin.core.flow.Subflow
    flowId: initialization_tasks
    namespace: chao_cold_storage
    wait: true
    transmitFailed: true
    labels:
      mute_alerts: true
    retry:
      type: constant
      interval: PT1M
      maxDuration: PT10M
      maxAttempts: 3
      warningOnRetry: true
    runIf: "{{ kv('is_initialized') == false }}"
    inputs:
      start_date: "{{ inputs.start_date | date('yyyy-MM-dd') }}"
      fruit_types: "{{ inputs.fruit_types }}"

  - id: iterate_months
    type: io.kestra.plugin.core.flow.ForEach
    concurrencyLimit: 1
    values: "{{ outputs.generate_lists.vars.month_range }}"
    tasks:
      - id: get_weather_data
        type: io.kestra.plugin.core.flow.Subflow
        flowId: retrieve_satellite_data
        namespace: chao_cold_storage
        wait: true
        transmitFailed: true
        inputs:
          start_date: "{{ taskrun.value }}"
          end_date: |
              {%- set one_month_after = taskrun.value | dateAdd(1, 'MONTHS') | date('yyyy-MM-dd', timeZone=inputs.user_timezone) -%}
              {%- set yesterday = now() | dateAdd(-1, 'DAYS') | date('yyyy-MM-dd', timeZone=inputs.user_timezone) -%}
              {%- if (one_month_after | date | timestamp) >= (yesterday | date | timestamp) -%}
              {{ yesterday }}
              {%- else -%}
              {{ one_month_after }}
              {%- endif -%}
          frequency: "{{ render(vars.frequency) }}"
          is_backfill: true
          
  - id: simulation_loop
    type: io.kestra.plugin.core.flow.ForEach
    concurrencyLimit: 1 # Enforces sequential day-by-day order
    values: "{{ outputs.generate_lists.vars.day_range }}"
    tasks:
      - id: download_historical_dependency
        type: io.kestra.plugin.gcp.gcs.Download
        projectId: "{{ kv('GCP_PROJECT_ID') }}"
        from: "gs://{{ kv('GCP_BUCKET_NAME') }}/raw/satellite/year={{ taskrun.value | date('yyyy') }}/month={{ taskrun.value | date('MM') }}/day={{ taskrun.value | date('dd') }}/satellite_data.parquet"

      - id: run_one_month
        type: io.kestra.plugin.core.flow.Subflow
        flowId: monthly_run
        namespace: chao_cold_storage
        wait: true
        transmitFailed: true
        labels:
          mute_alerts: true
        inputs:
          start_date: "{{ taskrun.value }}"
          end_date: "{{ taskrun.value }}"
          frequency: "{{ render(vars.frequency) }}"
          seed: "{{ vars.seed }}"
          fruit_types: "{{ inputs.fruit_types }}"
          weather_seed_data: "{{ outputs.download_historical_dependency[taskrun.value].uri }}"

      - id: append_raw_bq_tables
        type: io.kestra.plugin.core.flow.Subflow
        flowId: bq_load_incremental
        namespace: chao_cold_storage
        wait: true
        transmitFailed: true
        labels:
          mute_alerts: true
        retry:
          type: constant
          interval: PT1M
          maxDuration: PT10M
          maxAttempts: 3
          warningOnRetry: true
        inputs:
          date: "{{ taskrun.value }}"

  - id: execute_dbt
    type: io.kestra.plugin.core.flow.Subflow
    flowId: dbt_build
    namespace: chao_cold_storage
    wait: true
    transmitFailed: true
    labels:
      mute_alerts: true
    retry:
      type: constant
      interval: PT1M
      maxDuration: PT15M
      maxAttempts: 3
      warningOnRetry: true
    runIf: "{{ inputs.is_test == false }}"
    inputs:
        start_date: "{{ inputs.start_date | date('yyyy-MM-dd') }}"
    
  - id: mark_historical_data_generation_as_complete
    type: io.kestra.plugin.core.kv.Set
    runIf: "{{ kv('backfill_complete') == false }}"
    key: "backfill_complete"
    kvType: BOOLEAN
    value: "true"
