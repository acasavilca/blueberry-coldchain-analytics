id: dbt_build
namespace: blueberry_cold_storage

tasks:
  - id: execute_dbt
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: blueberry_dbt:v001
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    commands:
      - |
        set -e
        mkdir -p /root/.dbt
        cat > /root/.dbt/profiles.yml << EOF
        blueberry_cold_storage:
          target: prod
          outputs:
            prod:
              type: bigquery
              method: service-account-json
              project: {{kv('GCP_PROJECT_ID')}}
              dataset: {{kv('GCP_DATASET')}}
              location: {{kv('GCP_LOCATION')}}
              keyfile_json: {{secret('GCP_SERVICE_ACCOUNT')}}
              threads: 4
        EOF
        git clone --filter=blob:none --no-checkout https://github.com/acasavilca/blueberry-coldchain-analytics.git
        cd blueberry-coldchain-analytics/
        git sparse-checkout init --cone
        git sparse-checkout set dbt/
        git checkout master
        cd dbt/
        dbt deps --profiles-dir /root/.dbt
        dbt build --profiles-dir /root/.dbt
